# SinkholeHome - ha tang (TV1)
# Chay: docker compose up -d
# Chay them backend + frontend: docker compose --profile app up -d --build

services:
  unbound:
    image: mvance/unbound:latest
    container_name: unbound
    restart: unless-stopped
    volumes:
      - ./unbound:/opt/unbound/etc/unbound/custom:ro
    networks:
      sinkhole:
        ipv4_address: 172.20.0.3

  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    restart: unless-stopped
    depends_on:
      - unbound
    ports:
      - "${DNS_PORT:-53}:53/tcp"
      - "${DNS_PORT:-53}:53/udp"
      - "${PIHOLE_WEB_PORT:-8081}:80/tcp"
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD:-doi-mat-khau-nay}
      FTLCONF_dns_upstreams: "172.20.0.3#53"
      FTLCONF_dns_listeningMode: ALL
    volumes:
      - pihole_etc:/etc/pihole
    networks:
      sinkhole:
        ipv4_address: 172.20.0.2

  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: wireguard
    restart: unless-stopped
    depends_on:
      - pihole
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    environment:
      PUID: 1000
      PGID: 1000
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      SERVERURL: ${WG_SERVERURL:-auto}
      SERVERPORT: ${WG_PORT:-51820}
      PEERS: ${WG_PEERS:-phone,laptop}
      PEERDNS: 172.20.0.2
      INTERNAL_SUBNET: 10.13.13.0
      ALLOWEDIPS: 0.0.0.0/0
    ports:
      - "${WG_PORT:-51820}:51820/udp"
    volumes:
      - ./wireguard:/config
    networks:
      sinkhole:
        ipv4_address: 172.20.0.4

  # ----- Phan cua TV2 va TV3, chi chay khi co --profile app -----
  backend:
    profiles: ["app"]
    build: ./backend
    container_name: backend
    restart: unless-stopped
    depends_on:
      - pihole
    environment:
      PIHOLE_URL: ${PIHOLE_URL:-http://pihole:80}
      PIHOLE_PASSWORD: ${PIHOLE_PASSWORD}
      BACKEND_PORT: ${BACKEND_PORT:-8080}
    volumes:
      - ./blocklists:/blocklists:ro
    ports:
      - "${BACKEND_PORT:-8080}:${BACKEND_PORT:-8080}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${BACKEND_PORT:-8080}/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - sinkhole

  frontend:
    profiles: ["app"]
    build: ./frontend
    container_name: frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - sinkhole

volumes:
  pihole_etc:

networks:
  sinkhole:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
